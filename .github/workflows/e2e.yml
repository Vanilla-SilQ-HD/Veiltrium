name: Veiltrium e2e
# Veiltrium FULL end-to-end suite (about 30 minutes on two OS versions plus the upgrade job).
# Run manually on the exact commit before merging, releasing or substantial changes
# (Actions -> Veiltrium e2e -> Run workflow, or gh workflow run e2e.yml --ref <branch>).
# A fast-forward merge of an already tested commit does not need a second FULL run.
# Fast checks on every push: fast.yml. Nothing is merged without a green run here.
on:
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: "Release the upgrade job starts from (a commit or tag of this repository)"
        default: "v2026.10.13.1"

permissions:
  contents: read

# A newer run on a work branch replaces an older one; runs on main always finish.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # on the runner, needrestart would restart the GitHub agent mid-job
      NEEDRESTART_SUSPEND: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fast checks (also part of the full suite)
        run: |
          sudo apt-get -q install -y busybox >/dev/null
          bash tests/fast.sh

      - name: Emulate a fresh VPS (sshd with password and root login)
        run: |
          set -euxo pipefail
          sudo apt-get -q update
          sudo apt-get -q install -y openssh-server sshpass
          printf 'PasswordAuthentication yes\nPermitRootLogin yes\n' | sudo tee /etc/ssh/sshd_config.d/50-provider.conf
          sudo systemctl enable --now ssh.socket 2>/dev/null || true
          sudo systemctl start ssh.service || true
          sudo sshd -T | grep -E '^(port|passwordauthentication|permitrootlogin|persourcepenalties) '
          test -n "$(ss -Htln 'sport = :22')"

      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web panel of this commit
        run: bash panel/build.sh /tmp/veiltrium-panel amd64 ci

      - name: Install (first run)
        run: sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 PANEL_BINARY=/tmp/veiltrium-panel bash ./veiltrium.sh

      - name: Assertions
        run: |
          set -euxo pipefail
          systemctl is-active hysteria-server
          systemctl is-enabled hysteria-server nftables fail2ban
          sudo ss -Hulpn 'sport = :443' | grep '"hysteria"' >/dev/null
          sudo nft list table inet veiltrium
          sudo sshd -T | grep -x 'passwordauthentication yes' >/dev/null
          sudo sshd -T | grep -x 'permitrootlogin yes' >/dev/null
          sudo sshd -T | grep -x 'maxauthtries 6' >/dev/null
          sudo fail2ban-client status sshd
          test "$(sysctl -n net.core.rmem_max)" = 16777216
          test "$(sysctl -n net.ipv4.tcp_congestion_control)" = bbr
          test "$(sudo stat -c '%a' /root/veiltrium/client.txt)" = 600
          test "$(sudo stat -c '%a' /etc/hysteria/node.env)" = 600
          test "$(sudo stat -c '%a %U %G' /etc/hysteria/config.yaml)" = "640 root hysteria"
          test "$(sudo stat -c '%a %U %G' /etc/hysteria/server.key)" = "640 root hysteria"
          test "$(sudo stat -c '%a' /var/log/veiltrium-install.log)" = 600
          systemctl show hysteria-server -p User -p CapabilityBoundingSet -p AmbientCapabilities -p Environment | tee /tmp/unit.txt
          grep -F 'HYSTERIA_DISABLE_UPDATE_CHECK=true' /tmp/unit.txt >/dev/null
          grep -x 'User=hysteria' /tmp/unit.txt >/dev/null
          grep -x 'CapabilityBoundingSet=cap_net_bind_service' /tmp/unit.txt >/dev/null
          sudo systemd-analyze security hysteria-server --no-pager | tail -1
          sudo grep -v '^H_PASSWORD=' /etc/hysteria/node.env
          # VLESS Reality (Xray)
          systemctl is-active xray
          systemctl is-enabled xray
          sudo ss -Htlpn 'sport = :443' | grep '"xray"' >/dev/null
          test "$(sudo stat -c '%a' /usr/local/etc/xray/reality.env)" = 600
          test "$(sudo stat -c '%a %U %G' /usr/local/etc/xray/config.json)" = "640 root xray"
          systemctl show xray -p User -p CapabilityBoundingSet | tee /tmp/xunit.txt
          grep -x 'User=xray' /tmp/xunit.txt >/dev/null
          grep -x 'CapabilityBoundingSet=cap_net_bind_service' /tmp/xunit.txt >/dev/null
          sudo systemd-analyze security xray --no-pager | tail -1
          SITE="$(sudo awk -F= '$1=="R_SITE"{print $2}' /usr/local/etc/xray/reality.env)"
          echo "mask site: $SITE"
          # three separate TLS identities on a new node: the Reality site is NOT reused
          H="$(sudo awk -F= '$1=="H_SNI"{print $2}' /etc/hysteria/node.env)"
          T="$(sudo awk -F= '$1=="T_SNI"{print $2}' /etc/trusttunnel/node.env)"
          echo "reality=$SITE hysteria=$H trusttunnel=$T"
          test "$H" != "$SITE"; test "$T" != "$SITE"; test "$T" != "$H"
          sudo openssl x509 -in /etc/hysteria/server.crt -noout -checkhost "$H" | grep -F 'does match' >/dev/null
          sudo openssl x509 -in /etc/trusttunnel/cert.pem -noout -checkhost "$T" | grep -F 'does match' >/dev/null
          sudo grep -F "url: 'https://$H'" /etc/hysteria/config.yaml
          sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt | grep -F "sni=$H&" >/dev/null
          sudo grep -m1 '^vless://' /root/veiltrium/client.txt | grep -F "sni=${SITE}&" >/dev/null
          # crash safety and connection safety are in place
          systemctl is-enabled veiltrium-recover.service
          sudo test -x /usr/local/sbin/veiltrium-recover
          test -z "$(sudo find /var/lib/veiltrium/txn -name pending 2>/dev/null)"
          test "$(systemctl is-active veiltrium-watchdog.timer || true)" != active
          sudo perl -e 'our %nrconf; do "/etc/needrestart/conf.d/50-veiltrium.conf"; die $@ if $@; exit(scalar(keys %{$nrconf{override_rc}}) == 1 ? 0 : 1)'
          sudo nft list chain inet veiltrium output | grep -F "meta skuid $(id -u xray) jump proxy_egress" >/dev/null
          # TrustTunnel
          systemctl is-active trusttunnel
          systemctl is-enabled trusttunnel
          sudo ss -Htlpn 'sport = :8443' | grep '"trusttunnel_end"' >/dev/null
          sudo ss -Hulpn 'sport = :8443' | grep '"trusttunnel_end"' >/dev/null
          test "$(sudo stat -c '%a' /etc/trusttunnel/node.env)" = 600
          test "$(sudo stat -c '%a %U %G' /etc/trusttunnel/credentials.toml)" = "640 root trusttunnel"
          test "$(sudo stat -c '%a %U %G' /etc/trusttunnel/key.pem)" = "640 root trusttunnel"
          systemctl show trusttunnel -p User | grep -x 'User=trusttunnel' >/dev/null
          sudo systemd-analyze security trusttunnel --no-pager | tail -1
          sudo grep -m1 '^tt://' /root/veiltrium/client.txt >/dev/null
          sudo nft list chain inet veiltrium output | grep -F "meta skuid $(id -u trusttunnel) jump proxy_egress" >/dev/null
          # scanner blocklist: loaded, saved, refreshed weekly
          systemctl is-enabled veiltrium-scanner-block.timer
          test "$(sudo stat -c '%a' /etc/veiltrium/scanners.nft)" = 600
          n4="$(sudo nft -j list set inet veiltrium scanners4 | jq '[.nftables[] | select(.set) | (.set.elem // []) | length] | add')"
          echo "scanner networks loaded: $n4"
          test "$n4" -gt 1000
          sudo grep -x 'H_MASQ=auto' /etc/hysteria/node.env
          # a new node: a password per client (user:password) and links named after the node
          sudo grep -x 'H_AUTH=userpass' /etc/hysteria/node.env
          test "$(sudo stat -c '%a' /etc/veiltrium/node.env)" = 600
          sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt | grep -E '^hysteria2://main:[0-9a-f]{48}@.*#Veiltrium(-[A-Za-z0-9-]+)?$' >/dev/null
          sudo grep -m1 '^vless://' /root/veiltrium/client.txt | grep -E '#Veiltrium(-[A-Za-z0-9-]+)?$' >/dev/null
          sudo jq -e '(.node_name | test("^Veiltrium(-[A-Za-z0-9-]+)?$")) and .clients.added == 0 and .clients.hysteria_auth == "userpass"' /var/lib/veiltrium/report.json
          # a clean run prints no error at all (an ERR trap firing inside $(...) once did)
          if sudo grep -F 'ERROR:' /var/log/veiltrium-install.log; then echo "an error was printed during the install"; exit 1; fi
          if sudo grep -F 'sshd rejected the settings' /var/log/veiltrium-install.log; then exit 1; fi
          # report without secrets; no secrets in the install log either
          sudo jq -e '.reality.vps_verified == true and .hysteria2.vps_verified == true and .trusttunnel.h2.vps_verified == true' /var/lib/veiltrium/report.json
          sudo jq -e '.reality.selection.candidates | length == 10' /var/lib/veiltrium/report.json
          sudo jq -r '.reality.decision, (.reality.top3 | join(" ")), .trusttunnel.h3.vps' /var/lib/veiltrium/report.json
          for f in /etc/hysteria/node.env /etc/trusttunnel/node.env /usr/local/etc/xray/reality.env; do
            for v in $(sudo sed -nE 's/^(H_PASSWORD|T_PASS|R_UUID|R_PRIV|R_SID)=//p' "$f"); do
              if sudo grep -F "$v" /var/lib/veiltrium/report.json /var/log/veiltrium-install.log; then
                echo "a secret leaked into the report or the log"; exit 1
              fi
            done
          done
          test "$(sudo stat -c '%a' /root/veiltrium/probe.env)" = 600
          test "$(sudo stat -c '%a' /etc/veiltrium/probe.env)" = 600
          sudo grep -E '^P_(SERVER|HY2_SNI|REALITY_SNI|TT_SNI)=' /root/veiltrium/probe.env
          # no temporary files left behind
          test -z "$(sudo find /root /run -maxdepth 1 -name '.veiltrium.*')"

      - name: Firewall seen from outside (separate network namespace)
        run: |
          set -euxo pipefail
          sudo ip netns add ext
          sudo ip link add veth-h type veth peer name veth-e
          sudo ip link set veth-e netns ext
          sudo ip addr add 192.0.2.1/24 dev veth-h
          sudo ip link set veth-h up
          sudo ip netns exec ext ip addr add 192.0.2.2/24 dev veth-e
          sudo ip netns exec ext ip link set veth-e up
          sudo ip netns exec ext ip link set lo up
          # a service that must NOT be visible from outside
          sudo python3 -m http.server 8080 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'          # reachable from the server itself
          if sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/8080'; then
            echo "TCP 8080 reachable from outside"; exit 1
          fi
          sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/22'   # SSH is reachable from outside
          # TCP 443 from outside: a prober without the key sees the real certificate of the mask site
          SITE="$(sudo awk -F= '$1=="R_SITE"{print $2}' /usr/local/etc/xray/reality.env)"
          sudo ip netns exec ext openssl s_client -connect 192.0.2.1:443 -servername "$SITE" \
            -verify_hostname "$SITE" -verify_return_error </dev/null 2>/dev/null | tee /tmp/probe.txt \
            | grep -E '^(subject|issuer)=' || true
          grep -F 'Verify return code: 0 (ok)' /tmp/probe.txt >/dev/null
          URL="$(sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt)"
          EXT_URL="$(printf '%s' "$URL" | sed -E 's#@[^:/]+:#@192.0.2.1:#')"
          printf 'server: "%s"\nsocks5:\n  listen: 127.0.0.1:18092\n' "$EXT_URL" > /tmp/ext.yaml
          sudo ip netns exec ext /usr/local/bin/hysteria client -c /tmp/ext.yaml > /tmp/ext.log 2>&1 &
          for i in $(seq 1 30); do
            [ -n "$(sudo ip netns exec ext ss -Htln 'sport = :18092')" ] && break; sleep 0.5
          done
          code="$(sudo ip netns exec ext curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            --socks5-hostname 127.0.0.1:18092 https://www.gstatic.com/generate_204 || true)"
          echo "external hysteria client -> $code"
          [ "$code" = 204 ] || { cat /tmp/ext.log; exit 1; }
          rc=0
          sudo ip netns exec ext curl -s -o /dev/null --max-time 8 \
            --socks5-hostname 127.0.0.1:18092 http://192.0.2.1:8080/ || rc=$?
          echo "proxy -> server:8080 rc=$rc"
          [ "$rc" = 97 ]
          sudo pkill -f 'hysteria client -c /tmp/ext.yaml' || true
          sudo pkill -f 'http.server 8080' || true
          # A scanner address: both proxy ports go silent, SSH stays reachable
          sudo nft add element inet veiltrium scanners4 '{ 192.0.2.2 }'
          if sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/443'; then
            echo "TCP 443 answers a scanner address"; exit 1
          fi
          if sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/8443'; then
            echo "TrustTunnel answers a scanner address"; exit 1
          fi
          sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/22'
          sudo ip netns exec ext /usr/local/bin/hysteria client -c /tmp/ext.yaml > /tmp/ext-scan.log 2>&1 &
          for i in $(seq 1 30); do
            [ -n "$(sudo ip netns exec ext ss -Htln 'sport = :18092')" ] && break; sleep 0.5
          done
          code="$(sudo ip netns exec ext curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            --socks5-hostname 127.0.0.1:18092 https://www.gstatic.com/generate_204 || true)"
          sudo pkill -f 'hysteria client -c /tmp/ext.yaml' || true
          echo "hysteria from a scanner address -> $code"
          [ "$code" != 204 ]
          sudo nft delete element inet veiltrium scanners4 '{ 192.0.2.2 }'
          sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/443'   # open again once removed
          sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/8443'

      - name: TrustTunnel client end-to-end
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ttc
          gh release download v1.1.11 --repo TrustTunnel/TrustTunnelClient \
            --pattern 'trusttunnel_client-v1.1.11-linux-x86_64.tar.gz' --dir /tmp/ttc
          echo "00e0546a6b35840dbb92b741dff3da6732a74bf2d6c581e044bb4567c0d96825  /tmp/ttc/trusttunnel_client-v1.1.11-linux-x86_64.tar.gz" | sha256sum -c
          tar -xzf /tmp/ttc/trusttunnel_client-v1.1.11-linux-x86_64.tar.gz -C /tmp/ttc
          TTC="$(find /tmp/ttc -type f -name trusttunnel_client | head -1)"
          # the endpoint exports the client config (as for the tt:// link): it must carry our certificate
          U="$(sudo awk -F= '$1=="T_USER"{print $2}' /etc/trusttunnel/node.env)"
          P="$(sudo awk -F= '$1=="T_PASS"{print $2}' /etc/trusttunnel/node.env)"
          SNI="$(sudo awk -F= '$1=="T_SNI"{print $2}' /etc/trusttunnel/node.env)"
          sudo /usr/local/bin/trusttunnel_endpoint /etc/trusttunnel/vpn.toml /etc/trusttunnel/hosts.toml \
            -c "$U" -a 192.0.2.1:8443 --format toml > /tmp/tt-endpoint.toml
          grep -E '^(hostname|addresses|username|upstream_protocol) ' /tmp/tt-endpoint.toml
          grep -F 'BEGIN CERTIFICATE' /tmp/tt-endpoint.toml >/dev/null
          # client config as in the client's own integration tests, SOCKS mode, certificate pinned (no skip).
          # It runs on the server itself: the ext namespace has no DNS or internet for the client's
          # own start-up; reachability of 8443 from outside is checked in the firewall step.
          ttc_config() {   # $1 = output file, $2 = password
            {
              printf 'loglevel = "info"\nvpn_mode = "general"\nkillswitch_enabled = false\n\n[endpoint]\n'
              printf 'hostname = "%s"\naddresses = ["127.0.0.1:8443"]\nusername = "%s"\npassword = "%s"\n' "$SNI" "$U" "$2"
              printf 'has_ipv6 = false\nskip_verification = false\nupstream_protocol = "http2"\n'
              printf "certificate = '''\n%s\n'''\n" "$(sudo cat /etc/trusttunnel/cert.pem)"
              printf '\n[listener.socks]\naddress = "127.0.0.1:18096"\n'
            } > "$1"
          }
          tt_case() {   # $1 = config, prints the HTTP code through the tunnel
            sudo "$TTC" --config "$1" > /tmp/ttc.log 2>&1 &
            for i in $(seq 1 30); do
              [ -n "$(ss -Htln 'sport = :18096')" ] && break; sleep 0.5
            done
            sleep 2
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              --socks5-hostname 127.0.0.1:18096 https://www.gstatic.com/generate_204 || true
            sudo pkill -f "trusttunnel_client --config $1" || true
            sleep 1
          }
          ttc_config /tmp/tt-ok.toml "$P"
          code="$(tt_case /tmp/tt-ok.toml)"
          echo "trusttunnel client -> $code"
          [ "$code" = 204 ] || {
            grep -vE 'DEBUG|TRACE|retrieve_system_dns_servers' /tmp/ttc.log \
              | grep -iE 'error|fail|denied|refus|reject|certif|auth|listen|socks|endpoint|exit' | head -60
            exit 1; }
          ttc_config /tmp/tt-bad.toml definitely-wrong
          code="$(tt_case /tmp/tt-bad.toml)"
          echo "trusttunnel client, wrong password -> $code"
          [ "$code" != 204 ]
          # HTTP/3 on its own: TCP 8443 is blocked for the client, so a fallback to HTTP/2 cannot pass
          sed 's/upstream_protocol = "http2"/upstream_protocol = "http3"/' /tmp/tt-ok.toml > /tmp/tt-h3.toml
          sudo nft add table inet citt
          sudo nft add chain inet citt out '{ type filter hook output priority 10; policy accept; }'
          sudo nft add rule inet citt out ip daddr 127.0.0.1 tcp dport 8443 drop
          code="$(tt_case /tmp/tt-h3.toml)"
          sudo nft delete table inet citt
          echo "trusttunnel client, HTTP/3 only -> $code"
          [ "$code" = 204 ] || { grep -iE 'error|quic|h3|http3|certif' /tmp/ttc.log | head -40; exit 1; }

      - name: Router config exactly as delivered (sing-box, key pinning)
        run: |
          set -euo pipefail
          gh release download --repo SagerNet/sing-box --pattern 'sing-box-*-linux-amd64.tar.gz' --dir /tmp/sb
          tar -xzf /tmp/sb/*.tar.gz -C /tmp/sb
          SB="$(find /tmp/sb -type f -name sing-box | head -1)"
          "$SB" version | head -1
          sudo awk '/^\{/{f=1} f{print} f&&/^\}/{exit}' /root/veiltrium/client.txt > /tmp/router.json
          jq -e '.type=="hysteria2" and .tls.insecure==false and (.tls.certificate_public_key_sha256|length)==1' /tmp/router.json
          jq '.server="127.0.0.1"' /tmp/router.json > /tmp/delivered.json
          PK="$(jq -r '.tls.certificate_public_key_sha256[0]' /tmp/router.json)"
          BAD="AAAA${PK:4}"
          # the second JSON in the file is the VLESS Reality outbound
          sudo awk '/^\{/{n++} n==2{print} n==2&&/^\}/{exit}' /root/veiltrium/client.txt > /tmp/router-vless.json
          jq -e '.type=="vless" and .flow=="xtls-rprx-vision" and .tls.reality.enabled==true' /tmp/router-vless.json
          jq '.server="127.0.0.1"' /tmp/router-vless.json > /tmp/delivered-vless.json
          RPK="$(jq -r '.tls.reality.public_key' /tmp/router-vless.json)"
          # the vless:// link carries exactly the values of the outbound tested below
          VURL="$(sudo grep -m1 '^vless://' /root/veiltrium/client.txt)"
          Q="${VURL#*\?}"; Q="${Q%%#*}"
          qv() { printf '%s\n' "$Q" | tr '&' '\n' | awk -F= -v k="$1" '$1==k{print $2}'; }
          U="${VURL#vless://}"; U="${U%%@*}"
          test "$U" = "$(jq -r '.uuid' /tmp/router-vless.json)"
          test "$(qv pbk)" = "$RPK"
          test "$(qv sid)" = "$(jq -r '.tls.reality.short_id' /tmp/router-vless.json)"
          test "$(qv sni)" = "$(jq -r '.tls.server_name' /tmp/router-vless.json)"
          test "$(qv fp)" = "$(jq -r '.tls.utls.fingerprint' /tmp/router-vless.json)"
          test "$(qv flow)" = xtls-rprx-vision
          test "$(qv security)" = reality
          echo "vless:// link matches the router outbound"
          : > /tmp/sb-results
          run_case() {   # $1=name $2=jq-filter for the outbound $3=expect(ok|fail) [$4=base outbound]
            jq "$2" "${4:-/tmp/delivered.json}" > /tmp/out.json
            jq -n --slurpfile ob /tmp/out.json '{
              log: {level: "error"},
              inbounds: [{type: "socks", tag: "in", listen: "127.0.0.1", listen_port: 18090}],
              outbounds: $ob,
              route: {final: $ob[0].tag}
            }' > /tmp/sb.json
            "$SB" check -c /tmp/sb.json
            "$SB" run -c /tmp/sb.json > /tmp/sb.log 2>&1 &
            local pid=$! code got=fail
            for i in $(seq 1 20); do [ -n "$(ss -Htln 'sport = :18090')" ] && break; sleep 0.3; done
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --socks5-hostname 127.0.0.1:18090 https://www.gstatic.com/generate_204 || true)"
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
            [ "$code" = 204 ] && got=ok
            echo "CASE $1 -> http=$code ($got), expected $3" | tee -a /tmp/sb-results
            if [ "$got" != "$3" ]; then tail -20 /tmp/sb.log; return 1; fi
          }
          rc=0
          run_case "delivered (insecure=false + pin)" '.'                                          ok   || rc=1
          run_case "wrong pin"                         ".tls.certificate_public_key_sha256=[\"$BAD\"]" fail || rc=1
          run_case "wrong pin + insecure=true"         ".tls.certificate_public_key_sha256=[\"$BAD\"] | .tls.insecure=true" fail || rc=1
          run_case "no pin"                            'del(.tls.certificate_public_key_sha256)'   fail || rc=1
          # section 6: the sing-box JSON for AWG Manager's server group keeps the key pinning
          sudo awk '/^\[$/{f=1} f{print} f&&/^\]$/{exit}' /root/veiltrium/client.txt > /tmp/awg.json
          jq -e --arg pk "$PK" 'length == 1 and .[0].type == "hysteria2" and .[0].tls.certificate_public_key_sha256 == [$pk] and (.[0].tls.insecure // false) == false' /tmp/awg.json
          jq '.[0] | .server="127.0.0.1"' /tmp/awg.json > /tmp/awg-ob.json
          run_case "AWG Manager group JSON (pinned)" '.' ok /tmp/awg-ob.json || rc=1
          run_case "what AWG Manager makes of the link (insecure, no pin: connects unverified)" \
            'del(.tls.certificate_public_key_sha256) | .tls.insecure=true' ok /tmp/awg-ob.json || rc=1
          V=/tmp/delivered-vless.json
          run_case "reality delivered"                 '.'                                   ok   "$V" || rc=1
          run_case "reality wrong short_id"            '.tls.reality.short_id="0123456789abcdef"' fail "$V" || rc=1
          run_case "reality wrong public_key"          ".tls.reality.public_key=\"AAAA${RPK:4}\"" fail "$V" || rc=1
          exit $rc

      - name: fail2ban bans real failed password logins (from outside)
        run: |
          set -euxo pipefail
          # The attacker is the external address 192.0.2.2 in the ext namespace (fail2ban
          # ignores the server's own addresses because of ignoreself).
          for i in 1 2 3 4 5 6; do
            sudo ip netns exec ext sshpass -p 'definitely-wrong' ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no -o ConnectTimeout=5 root@192.0.2.1 true 2>/dev/null || true
            sleep 6   # longer than the PerSourcePenalties penalty (5 s), so every attempt reaches sshd
          done
          sleep 3
          sudo fail2ban-client status sshd | tee /tmp/f2b.txt
          grep -F '192.0.2.2' /tmp/f2b.txt >/dev/null
          sudo nft list ruleset | grep -F '192.0.2.2' >/dev/null
          # the banned address can no longer reach SSH
          if sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/22'; then
            echo "banned address still reaches SSH"; exit 1
          fi
          sudo fail2ban-client set sshd unbanip 192.0.2.2
          sudo ip netns exec ext timeout 5 bash -c 'exec 3<>/dev/tcp/192.0.2.1/22'

      - name: Reboot simulation (cold firewall, sysctl, services)
        run: |
          set -euxo pipefail
          sudo systemctl stop nftables          # as after a reboot: no rules
          test -z "$(sudo nft list table inet veiltrium 2>/dev/null || true)"
          sudo systemctl start nftables
          sudo nft list table inet veiltrium >/dev/null
          # the scanner list comes back from the saved file at boot
          test "$(sudo nft -j list set inet veiltrium scanners4 | jq '[.nftables[] | select(.set) | (.set.elem // []) | length] | add')" -gt 1000
          # a failed download keeps the current list
          before="$(sudo sha256sum /etc/veiltrium/scanners.nft)"
          if sudo env SCANNER_URLS=https://example.invalid/x.list /usr/local/sbin/veiltrium-scanner-block; then
            echo "update with a broken source must fail"; exit 1
          fi
          test "$before" = "$(sudo sha256sum /etc/veiltrium/scanners.nft)"
          test "$(sudo nft -j list set inet veiltrium scanners4 | jq '[.nftables[] | select(.set) | (.set.elem // []) | length] | add')" -gt 1000
          # the timer's service unit works as installed
          sudo systemctl start veiltrium-scanner-block.service
          systemctl show veiltrium-scanner-block.service -p Result | grep -x 'Result=success' >/dev/null
          sudo sysctl -q -w net.core.rmem_max=212992
          sudo systemctl restart systemd-sysctl
          test "$(sysctl -n net.core.rmem_max)" = 16777216
          sudo systemctl restart fail2ban hysteria-server xray trusttunnel
          sleep 3
          systemctl is-active hysteria-server fail2ban xray trusttunnel

      - name: Hysteria client with the share link (URI)
        run: |
          set -euo pipefail
          URL="$(sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt)"
          LOCAL_URL="$(printf '%s' "$URL" | sed -E 's#@[^:/]+:#@127.0.0.1:#')"
          printf 'server: "%s"\nsocks5:\n  listen: 127.0.0.1:18091\n' "$LOCAL_URL" > /tmp/hyc.yaml
          /usr/local/bin/hysteria client -c /tmp/hyc.yaml > /tmp/hyc.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do [ -n "$(ss -Htln 'sport = :18091')" ] && break; sleep 0.5; done
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --socks5-hostname 127.0.0.1:18091 https://www.gstatic.com/generate_204 || true)"
          kill "$pid" || true
          echo "share link -> http=$code"
          if [ "$code" != 204 ]; then cat /tmp/hyc.log; exit 1; fi

      - name: Local test sites (Reality candidates, a slow download target)
        run: bash tests/sites-setup.sh

      - name: Second run changes nothing, restarts nothing, drops no connection, does not reboot
        run: |
          set -euo pipefail
          KEEP="/etc/hysteria/node.env /etc/hysteria/config.yaml /etc/hysteria/server.crt /etc/hysteria/server.key
            /usr/local/etc/xray/reality.env /usr/local/etc/xray/config.json
            /etc/trusttunnel/node.env /etc/trusttunnel/cert.pem /etc/trusttunnel/key.pem /etc/trusttunnel/vpn.toml
            /etc/trusttunnel/hosts.toml /etc/trusttunnel/credentials.toml
            /etc/systemd/system/hysteria-server.service /etc/systemd/system/xray.service /etc/systemd/system/trusttunnel.service
            /etc/systemd/system/veiltrium-scanner-block.service /etc/systemd/system/veiltrium-recover.service
            /etc/nftables.conf /etc/fail2ban/jail.d/veiltrium-sshd.local /etc/sysctl.d/99-zz-veiltrium-hardening.conf
            /etc/ssh/sshd_config.d/00-veiltrium-hardening.conf /root/veiltrium/probe.env /etc/veiltrium/probe.env"
          ids() { for s in hysteria-server xray trusttunnel fail2ban; do systemctl show "$s" -p InvocationID --value; done; }
          links() { sudo grep -E '^(hysteria2|vless|tt)://' /root/veiltrium/client.txt; }
          before="$(sudo sha256sum $KEEP)"; ids0="$(ids)"; links0="$(links)"
          # live connections through all three protocols, from outside
          bash tests/longconn.sh start
          # the updates "need" a reboot: a working node must still not reboot by itself
          sudo touch /run/reboot-required
          # as after an openssh-server upgrade with socket activation: no privilege separation dir
          sudo rm -rf /run/sshd
          # head closes the output after 5 lines, like a dropped SSH session without a terminal
          sudo env NEEDRESTART_SUSPEND=1 bash -c 'set -o pipefail; bash ./veiltrium.sh | head -n 5'
          bash tests/longconn.sh running
          sudo rm -f /run/reboot-required
          sudo tail -n 120 /var/log/veiltrium-install.log | grep -F '== DONE ==' >/dev/null
          sudo grep -F 'or it will do so at night' /var/log/veiltrium-install.log >/dev/null
          if sudo grep -F 'sshd rejected the settings' /var/log/veiltrium-install.log; then exit 1; fi
          sudo sshd -T | grep -x 'maxauthtries 6' >/dev/null
          if sudo grep -F 'will reboot in 1 minute' /var/log/veiltrium-install.log; then
            sudo shutdown -c || true; echo "a working node scheduled a reboot"; exit 1
          fi
          test "$before" = "$(sudo sha256sum $KEEP)"
          test "$ids0" = "$(ids)"           # no service was restarted
          test "$links0" = "$(links)"
          systemctl is-active hysteria-server xray trusttunnel
          bash tests/longconn.sh finish     # every download completed in full

      - name: A failed Hysteria or TrustTunnel change restores the previous settings
        run: |
          set -euo pipefail
          H_FILES="/etc/hysteria/node.env /etc/hysteria/config.yaml /etc/hysteria/server.crt /etc/hysteria/server.key"
          T_FILES="/etc/trusttunnel/node.env /etc/trusttunnel/cert.pem /etc/trusttunnel/key.pem /etc/trusttunnel/hosts.toml"
          links0="$(sudo grep -E '^(hysteria2|tt)://' /root/veiltrium/client.txt)"
          # Hysteria will not start with the new settings (systemd refuses: ExecStartPre fails)
          h0="$(sudo sha256sum $H_FILES)"
          sudo mkdir -p /run/systemd/system/hysteria-server.service.d
          printf '[Service]\nExecStartPre=/bin/false\n' | sudo tee /run/systemd/system/hysteria-server.service.d/ci.conf >/dev/null
          sudo systemctl daemon-reload
          rc=0; sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 HY2_SNI=www.example.org bash ./veiltrium.sh > /tmp/hf.log 2>&1 || rc=$?
          sudo rm -rf /run/systemd/system/hysteria-server.service.d; sudo systemctl daemon-reload
          sudo systemctl reset-failed hysteria-server; sudo systemctl restart hysteria-server
          echo "rc=$rc"; test "$rc" = 1
          grep -F 'previous settings (password, certificate, link) were restored' /tmp/hf.log >/dev/null
          test "$h0" = "$(sudo sha256sum $H_FILES)"
          test -z "$(sudo find /var/lib/veiltrium/txn -name pending)"
          # TrustTunnel likewise
          t0="$(sudo sha256sum $T_FILES)"
          sudo mkdir -p /run/systemd/system/trusttunnel.service.d
          printf '[Service]\nExecStartPre=/bin/false\n' | sudo tee /run/systemd/system/trusttunnel.service.d/ci.conf >/dev/null
          sudo systemctl daemon-reload
          rc=0; sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 TT_SNI=www.example.org bash ./veiltrium.sh > /tmp/tf.log 2>&1 || rc=$?
          sudo rm -rf /run/systemd/system/trusttunnel.service.d; sudo systemctl daemon-reload
          sudo systemctl reset-failed trusttunnel; sudo systemctl restart trusttunnel
          echo "rc=$rc"; test "$rc" = 2
          grep -F 'The new TrustTunnel settings did not work; the previous settings were restored' /tmp/tf.log >/dev/null
          test "$t0" = "$(sudo sha256sum $T_FILES)"
          # the next normal run is clean and the links are the same as before
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/after.log 2>&1
          test "$links0" = "$(sudo grep -E '^(hysteria2|tt)://' /root/veiltrium/client.txt)"
          systemctl is-active hysteria-server trusttunnel

      - name: Hysteria and TrustTunnel names are their own saved settings, independent of Reality
        run: |
          set -euo pipefail
          SITE="$(sudo awk -F= '$1=="R_SITE"{print $2}' /usr/local/etc/xray/reality.env)"
          H0="$(sudo awk -F= '$1=="H_SNI"{print $2}' /etc/hysteria/node.env)"
          pw="$(sudo awk -F= '$1=="H_PASSWORD"{print $2}' /etc/hysteria/node.env)"
          OTHER="/usr/local/etc/xray/reality.env /usr/local/etc/xray/config.json /etc/trusttunnel/node.env /etc/trusttunnel/cert.pem"
          other_before="$(sudo sha256sum $OTHER)"
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 HY2_SNI=bing.com bash ./veiltrium.sh > /tmp/mig1.log 2>&1
          sudo grep -x 'H_SNI=bing.com' /etc/hysteria/node.env
          sudo openssl x509 -in /etc/hysteria/server.crt -noout -checkhost bing.com | grep -F 'does match' >/dev/null
          grep -F "Hysteria SNI changes: ${H0} -> bing.com" /tmp/mig1.log >/dev/null
          test "$(sudo sha256sum $OTHER)" = "$other_before"      # Reality and TrustTunnel untouched
          crt="$(sudo sha256sum /etc/hysteria/server.crt)"
          # the setting is saved: a run without variables keeps it (no new certificate)
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/mig2.log 2>&1
          sudo grep -x 'H_SNI=bing.com' /etc/hysteria/node.env
          test "$(sudo sha256sum /etc/hysteria/server.crt)" = "$crt"
          # "auto": a name of its own again - never the Reality site; same password, new certificate
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 HY2_SNI=auto bash ./veiltrium.sh > /tmp/mig3.log 2>&1
          H="$(sudo awk -F= '$1=="H_SNI"{print $2}' /etc/hysteria/node.env)"
          T="$(sudo awk -F= '$1=="T_SNI"{print $2}' /etc/trusttunnel/node.env)"
          echo "auto -> $H (reality $SITE, trusttunnel $T)"
          test "$H" != "$SITE"; test "$H" != "$T"; test "$H" != bing.com
          sudo openssl x509 -in /etc/hysteria/server.crt -noout -checkhost "$H" | grep -F 'does match' >/dev/null
          test "$(sudo awk -F= '$1=="H_PASSWORD"{print $2}' /etc/hysteria/node.env)" = "$pw"
          test "$(sudo sha256sum $OTHER)" = "$other_before"
          # TrustTunnel hostname: its own setting as well, same credentials
          tt_pass="$(sudo awk -F= '$1=="T_PASS"{print $2}' /etc/trusttunnel/node.env)"
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 TT_SNI=www.example.com bash ./veiltrium.sh > /tmp/mig4.log 2>&1
          sudo grep -x 'T_SNI=www.example.com' /etc/trusttunnel/node.env
          sudo grep -x "H_SNI=${H}" /etc/hysteria/node.env
          test "$(sudo awk -F= '$1=="T_PASS"{print $2}' /etc/trusttunnel/node.env)" = "$tt_pass"
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 TT_SNI=auto bash ./veiltrium.sh > /tmp/mig5.log 2>&1
          T="$(sudo awk -F= '$1=="T_SNI"{print $2}' /etc/trusttunnel/node.env)"
          test "$T" != "$SITE"; test "$T" != "$H"; test "$T" != www.example.com
          URL="$(sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt)"
          printf 'server: "%s"\nsocks5:\n  listen: 127.0.0.1:18093\n' "$(printf '%s' "$URL" | sed -E 's#@[^:/]+:#@127.0.0.1:#')" > /tmp/mig.yaml
          /usr/local/bin/hysteria client -c /tmp/mig.yaml > /tmp/mig-client.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do [ -n "$(ss -Htln 'sport = :18093')" ] && break; sleep 0.5; done
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --socks5-hostname 127.0.0.1:18093 https://www.gstatic.com/generate_204 || true)"
          kill "$pid" || true
          echo "migrated link -> http=$code"
          [ "$code" = 204 ] || { cat /tmp/mig-client.log; exit 1; }

      - name: Re-run with a failing Reality check keeps the working node and its link
        run: |
          set -euo pipefail
          KEEP="/etc/hysteria/node.env /usr/local/etc/xray/reality.env /usr/local/etc/xray/config.json"
          before="$(sudo sha256sum $KEEP)"
          # transient failure: the xray service is blocked from TCP 443 egress (separate table, the script does not touch it)
          sudo nft add table inet citest
          sudo nft add chain inet citest out '{ type filter hook output priority 10; policy accept; }'
          sudo nft add rule inet citest out meta skuid "$(id -u xray)" tcp dport 443 drop
          rc=0
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/fail.log 2>&1 || rc=$?
          sudo nft delete table inet citest
          echo "rc=$rc"
          [ "$rc" = 2 ]
          grep -F 'kept the previous settings' /tmp/fail.log >/dev/null
          grep -F 'Isolation works: service xray' /tmp/fail.log >/dev/null
          systemctl is-active xray
          test "$before" = "$(sudo sha256sum $KEEP)"
          sudo grep -m1 '^vless://' /root/veiltrium/client.txt >/dev/null

      - name: Reality site selection, re-selection, rollback, interruption, lock, trial
        run: bash tests/reselect-ci.sh

      - name: Home-network probe (Keenetic simulation with the router's sing-box)
        run: bash tests/probe-ci.sh

      - name: Non-default Reality and TrustTunnel ports survive a plain re-run
        run: |
          set -euo pipefail
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 REALITY_PORT=8444 TT_PORT=9443 bash ./veiltrium.sh > /tmp/p1.log 2>&1             || { tail -40 /tmp/p1.log; exit 1; }
          sudo ss -Htlpn 'sport = :8444' | grep '"xray"' >/dev/null
          sudo ss -Htulpn 'sport = :9443' | grep '"trusttunnel_end"' >/dev/null
          FILES="/usr/local/etc/xray/config.json /etc/trusttunnel/vpn.toml /etc/nftables.conf"
          ids() { for s in xray trusttunnel; do systemctl show "$s" -p InvocationID --value; done; }
          links() { sudo grep -E '^(vless|tt)://' /root/veiltrium/client.txt; }
          before="$(sudo sha256sum $FILES)"; ids0="$(ids)"; links0="$(links)"
          links | grep -F ':8444?' >/dev/null
          # a plain re-run: same ports, same files, same links, nothing restarted
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/p2.log 2>&1 || { tail -40 /tmp/p2.log; exit 1; }
          test "$before" = "$(sudo sha256sum $FILES)"
          test "$ids0" = "$(ids)"
          test "$links0" = "$(links)"
          sudo ss -Htlpn 'sport = :8444' | grep '"xray"' >/dev/null
          # and --diagnose checks the real ports
          sudo bash ./veiltrium.sh --diagnose > /tmp/p3.log 2>&1 || { cat /tmp/p3.log; exit 1; }
          if grep -F 'ERROR' /tmp/p3.log; then echo "--diagnose printed an error"; exit 1; fi
          grep -F 'clients main + 0 added' /tmp/p3.log >/dev/null
          grep -F 'port 8444' /tmp/p3.log >/dev/null
          # back to the defaults, explicitly
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 REALITY_PORT=443 TT_PORT=8443 bash ./veiltrium.sh > /tmp/p4.log 2>&1
          sudo ss -Htlpn 'sport = :443' | grep '"xray"' >/dev/null

      - name: Added clients (real clients on every protocol, re-run, rollback, revoke)
        run: bash tests/clients-ci.sh

      - name: Web panel (loopback only, helper, login and CSRF rules, a client change, new password)
        run: bash tests/panel-ci.sh

      - name: Diagnostics
        if: always()
        run: |
          sudo journalctl -u hysteria-server --no-pager -n 60 || true
          sudo journalctl -u xray --no-pager -n 40 || true
          sudo journalctl -u trusttunnel --no-pager -n 30 || true
          sudo tail -n 30 /var/log/fail2ban.log || true
          sudo tail -n 120 /var/log/veiltrium-install.log | sed -E 's/[0-9a-f]{48}/<pw>/g' || true
          sudo jq . /var/lib/veiltrium/report.json || true

  # The upgrade starts from the release in use (input upgrade_from; v2026.10.13.1 is the last
  # hy2-secure-install.sh). The first run of this version moves the node to the Veiltrium names:
  # the same keys, passwords, certificates and links, the old files gone, the services
  # restarted once (their config comments changed). A second run then changes nothing.
  upgrade:
    name: upgrade from ${{ inputs.upgrade_from || 'v2026.10.13.1' }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEEDRESTART_SUSPEND: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Emulate a fresh VPS
        run: |
          set -euxo pipefail
          sudo apt-get -q update
          sudo apt-get -q install -y openssh-server
          printf 'PasswordAuthentication yes\nPermitRootLogin yes\n' | sudo tee /etc/ssh/sshd_config.d/50-provider.conf
          sudo systemctl enable --now ssh.socket 2>/dev/null || true
          sudo systemctl start ssh.service || true

      - name: Install the release in use
        env:
          FROM: ${{ inputs.upgrade_from || 'v2026.10.13.1' }}
        run: |
          git cat-file -e "${FROM}^{commit}" || { echo "::error::upgrade_from ${FROM} is not in this repository"; exit 1; }
          git show "${FROM}:veiltrium.sh" > /tmp/old.sh 2>/dev/null || git show "${FROM}:hy2-secure-install.sh" > /tmp/old.sh
          sudo env NEEDRESTART_SUSPEND=1 HY2_AUTO_REBOOT=0 VT_AUTO_REBOOT=0 bash /tmp/old.sh
          # a client of the old version must survive the move too
          sudo env NEEDRESTART_SUSPEND=1 bash /tmp/old.sh --add-client anna > /tmp/old-add.log 2>&1 || { cat /tmp/old-add.log; exit 1; }

      - name: Upgrade to this version (moves the node to the Veiltrium names)
        run: |
          set -euo pipefail
          # the links without their display name: '#name' of hysteria2/vless, TLV field 0x0C of tt://
          creds() {
            sudo grep -hE '^(hysteria2|vless|tt)://' "$@" | python3 -c '
          import base64, sys
          for line in sys.stdin.read().split():
              if not line.startswith("tt://"):
                  print(line.split("#")[0]); continue
              b = line.split("?", 1)[1]; d = base64.urlsafe_b64decode(b + "=" * (-len(b) % 4)); i = 0; out = []
              def vi():
                  global i
                  n = 1 << (d[i] >> 6); v = d[i] & 0x3f
                  for k in range(1, n): v = (v << 8) | d[i + k]
                  i += n; return v
              while i < len(d):
                  t = vi(); n = vi()
                  if t != 12: out.append("%d=%s" % (t, d[i:i + n].hex()))
                  i += n
              print("tt", " ".join(out))'
          }
          KEYS="/etc/hysteria/server.crt /etc/hysteria/server.key /etc/hysteria/node.env
            /usr/local/etc/xray/reality.env /usr/local/etc/xray/config.json
            /etc/trusttunnel/cert.pem /etc/trusttunnel/key.pem /etc/trusttunnel/node.env /etc/trusttunnel/credentials.toml"
          keys0="$(sudo sha256sum $KEYS)"
          creds0="$(creds /root/hy2-client.txt /root/hy2-clients/anna.txt)"
          state0="$(sudo cat /etc/hy2-secure/probe.env /etc/hy2-secure/node.env /etc/hy2-secure/clients/anna.env)"
          test "$(printf '%s\n' "$creds0" | grep -c .)" = 6      # three links each for main and anna
          sudo nft list table inet hy2fw >/dev/null
          # 1) a move cut off early (apt fails in step 2): the firewall file on disk must still load
          mkdir -p /tmp/failapt
          printf '#!/bin/sh\necho "apt-get: simulated failure" >&2\nexit 100\n' > /tmp/failapt/apt-get
          chmod 755 /tmp/failapt/apt-get
          rc=0
          sudo env PATH="/tmp/failapt:$PATH" NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/cut.log 2>&1 || rc=$?
          echo "cut-off move: rc=$rc"; test "$rc" = 1
          grep -F 'could not update package lists' /tmp/cut.log >/dev/null
          sudo nft -c -f /etc/nftables.conf
          sudo systemctl restart nftables        # as after a reboot: only what is on disk
          sudo nft list table inet veiltrium >/dev/null
          test "$(sudo nft -j list set inet veiltrium scanners4 | jq '[.nftables[] | select(.set) | (.set.elem // []) | length] | add')" -gt 1000
          sudo systemctl restart fail2ban
          # a half-moved node: the maintenance modes refuse, the installer finishes the move
          if sudo bash ./veiltrium.sh --diagnose > /tmp/half.log 2>&1; then echo "diagnose ran on a half-moved node"; exit 1; fi
          grep -F 'run the installer once' /tmp/half.log >/dev/null
          # 2) the move run to the end
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/up.log 2>&1 || { tail -60 /tmp/up.log; exit 1; }
          grep -F 'moving it to the Veiltrium names' /tmp/up.log >/dev/null
          if sudo grep -F 'ERROR:' /var/log/veiltrium-install.log; then exit 1; fi
          # the same secrets and links
          test "$keys0" = "$(sudo sha256sum $KEYS)"
          test "$creds0" = "$(creds /root/veiltrium/client.txt /root/veiltrium/clients/anna.txt)"
          test "$state0" = "$(sudo cat /etc/veiltrium/probe.env /etc/veiltrium/node.env /etc/veiltrium/clients/anna.env)"
          # nothing of the old names is left
          for f in /etc/hy2-secure /var/lib/hy2-secure /root/hy2-client.txt /root/hy2-probe.env /root/hy2-clients \
                   /etc/systemd/system/hy2-scanner-block.timer /etc/systemd/system/hy2-secure-recover.service \
                   /usr/local/sbin/hy2-scanner-block /usr/local/sbin/hy2-secure-recover /etc/sysctl.d/99-zz-hy2-hardening.conf \
                   /etc/ssh/sshd_config.d/00-hy2-hardening.conf /etc/fail2ban/jail.d/hy2-sshd.local \
                   /etc/needrestart/conf.d/50-hy2-secure.conf /etc/apt/apt.conf.d/52hy2-unattended-upgrades; do
            if sudo test -e "$f"; then echo "left over: $f"; exit 1; fi
          done
          if sudo nft list table inet hy2fw >/dev/null 2>&1; then echo "the old firewall table is still loaded"; exit 1; fi
          left="$(sudo find /etc /root /var/lib /var/log /usr/local /run -name '*hy2*' 2>/dev/null || true)"
          if [ -n "$left" ]; then echo "old names left: $left"; exit 1; fi
          if sudo grep -rn 'hy2-secure\|hy2fw' /etc/nftables.conf /etc/systemd/system /etc/veiltrium; then echo "an old name in a new file"; exit 1; fi
          test "$(sudo nft -j list set inet veiltrium scanners4 | jq '[.nftables[] | select(.set) | (.set.elem // []) | length] | add')" -gt 1000
          systemctl is-active hysteria-server xray trusttunnel fail2ban
          systemctl is-enabled veiltrium-scanner-block.timer veiltrium-recover.service
          sudo sshd -T | grep -x 'maxauthtries 6' >/dev/null
          LABEL="$(sudo jq -r .node_name /var/lib/veiltrium/report.json)"
          sudo grep -m1 '^vless://' /root/veiltrium/client.txt | grep -F "#${LABEL}" >/dev/null
          # the maintenance modes work on the moved node
          sudo bash ./veiltrium.sh --diagnose > /tmp/diag.log 2>&1 || { cat /tmp/diag.log; exit 1; }
          sudo bash ./veiltrium.sh --list-clients --json - | jq -e '.clients | map(.name) == ["main", "anna"]'
          # a second run changes nothing and restarts nothing
          ALL="$KEYS /etc/hysteria/config.yaml /etc/trusttunnel/vpn.toml /etc/trusttunnel/hosts.toml
            /etc/systemd/system/hysteria-server.service /etc/systemd/system/xray.service /etc/systemd/system/trusttunnel.service
            /etc/nftables.conf /etc/fail2ban/jail.d/veiltrium-sshd.local /etc/sysctl.d/99-zz-veiltrium-hardening.conf
            /etc/ssh/sshd_config.d/00-veiltrium-hardening.conf /etc/veiltrium/node.env /root/veiltrium/probe.env"
          ids() { for s in hysteria-server xray trusttunnel fail2ban; do systemctl show "$s" -p InvocationID --value; done; }
          all0="$(sudo sha256sum $ALL)"; ids0="$(ids)"
          sudo env NEEDRESTART_SUSPEND=1 VT_AUTO_REBOOT=0 bash ./veiltrium.sh > /tmp/up2.log 2>&1 || { tail -60 /tmp/up2.log; exit 1; }
          test "$all0" = "$(sudo sha256sum $ALL)"
          test "$ids0" = "$(ids)"
          if grep -F 'moving it to the Veiltrium names' /tmp/up2.log; then exit 1; fi
          echo "the move kept every secret and link; the second run changed nothing"

      - name: Links of the moved node work
        run: |
          set -euo pipefail
          hy() {   # $1 = hysteria2:// link -> HTTP code through a Hysteria client
            printf 'server: "%s"\nsocks5:\n  listen: 127.0.0.1:18111\n' "$(printf '%s' "$1" | sed -E 's#@[^:/]+:#@127.0.0.1:#')" > /tmp/u.yaml
            /usr/local/bin/hysteria client -c /tmp/u.yaml > /tmp/u.log 2>&1 &
            local pid=$!
            for i in $(seq 1 30); do [ -n "$(ss -Htln 'sport = :18111')" ] && break; sleep 0.3; done
            curl -s -o /dev/null -w '%{http_code}' --max-time 12 --socks5-hostname 127.0.0.1:18111 https://www.gstatic.com/generate_204 || true
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          }
          c="$(hy "$(sudo grep -m1 '^hysteria2://' /root/veiltrium/client.txt)")"; echo "main -> $c"; [ "$c" = 204 ]
          c="$(hy "$(sudo grep -m1 '^hysteria2://' /root/veiltrium/clients/anna.txt)")"; echo "anna -> $c"; [ "$c" = 204 ]
          sudo env NEEDRESTART_SUSPEND=1 bash ./veiltrium.sh --remove-client anna > /tmp/rm.log 2>&1 || { cat /tmp/rm.log; exit 1; }
          sudo test ! -e /root/veiltrium/clients/anna.txt

      - name: Diagnostics
        if: always()
        run: sudo tail -n 80 /var/log/veiltrium-install.log | sed -E 's/[0-9a-f]{48}/<pw>/g' || true
