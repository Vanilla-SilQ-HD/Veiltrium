name: Veiltrium panel release
# A tag panel-vX.Y.Z builds the web panel for amd64 and arm64 and publishes the binaries
# with their SHA-256 sums. The installer pins the version and the sums (PANEL_VERSION,
# PANEL_SHA256_*), like the proxies it installs.
on:
  push:
    tags: ['panel-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: panel/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        run: cd panel && mkdir -p web/dist && touch web/dist/.gitkeep && go vet ./... && go test ./...
      - name: Build
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#panel-v}"
          for a in amd64 arm64; do bash panel/build.sh "dist/veiltrium-panel-linux-$a" "$a" "$v"; done
          test "$(dist/veiltrium-panel-linux-amd64 version)" = "$v"
          cd dist && sha256sum veiltrium-panel-linux-* | tee SHA256SUMS
      - name: Extract release notes
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#panel-v}"
          awk -v section="### [$v]" '
            index($0, section " ") == 1 { found = 1; next }
            found && /^### \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/veiltrium-panel-linux-amd64 dist/veiltrium-panel-linux-arm64 dist/SHA256SUMS \
            --title "Veiltrium panel ${GITHUB_REF_NAME#panel-v}" --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.md"
