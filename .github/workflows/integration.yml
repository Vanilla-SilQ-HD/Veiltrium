name: Veiltrium integration
# Expensive suites run for PRs only, never again on the merge or a tag push.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      profile:
        description: "Select the system suite"
        type: choice
        options: [integration, full]
        default: integration

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      full_required: ${{ steps.plan.outputs.full_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete PR diff
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 tests/ci_policy.py --manual "$PROFILE"
          else
            python3 tests/ci_policy.py --base "$BASE" --head "$HEAD" --draft "$DRAFT"
          fi

  system:
    needs: plan
    if: ${{ needs.plan.outputs.profile != 'fast' }}
    uses: ./.github/workflows/e2e.yml
    with:
      profile: ${{ needs.plan.outputs.profile }}

  result:
    name: CI policy
    if: ${{ always() }}
    needs: [plan, system]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected suite to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$PROFILE" == fast ]]; then
            test "$SYSTEM_RESULT" = skipped
          else
            test "$SYSTEM_RESULT" = success
          fi
